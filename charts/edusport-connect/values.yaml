# values.yaml — ÉduSport Connect (prod)
# Les images sont mises à jour automatiquement par la CI (build-and-push.yml)
# Format : ghcr.io/<owner>/<image>@sha256:<digest>  (piqué par la CI)

namespace: edusport-connect

# Nom de domaine principal (utilisé par l'IngressRoute Traefik)
domain: edusportconnect.fr

# ── Ingress (Traefik) ──────────────────────────────────────────────────────────
ingress:
  entryPoints:
    - websecure
  # Active le middleware crowdsec-bouncer (présent dans kube-system du cluster).
  # Passer à false si CrowdSec n'est pas installé.
  crowdsec: true

# ── Frontend (nginx) ──────────────────────────────────────────────────────────
frontend:
  image: ghcr.io/emmguardia/edusport-connect-front@sha256:c61a434cc4ca08fbe29b32b20934d270b96ff813f036907f93726b9256e37ad2
  imagePullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80

# ── Backend (Node.js) ─────────────────────────────────────────────────────────
backend:
  # L'image sera pinnée par la CI après le premier build
  image: ghcr.io/emmguardia/edusport-connect-back@sha256:6c55a911987a1b8308a34473dc527c4d23d97b747687712f81c058ee423cb43e
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  frontendUrl: https://edusportconnect.fr
  adminNotificationEmail: contact@edusportconnect.fr
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
