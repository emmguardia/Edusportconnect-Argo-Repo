# Build & push : main -> bump version + scan Trivy + push GHCR + pin digest dans values.yaml
# ArgoCD : App Prod = branche main + namespace edusport-connect
#
# Runners GitHub-hosted ubuntu-latest (illimités pour repo public).
# pnpm + minimum-release-age 24h pour défense supply-chain.
#
# Secrets GitHub requis : aucun en dehors du GITHUB_TOKEN fourni par la plateforme.
#
# ── CE QUI A CHANGÉ ──────────────────────────────────────────────────────────
#
# 1. LE `npm update` EN PLEIN DÉPLOIEMENT A ÉTÉ RETIRÉ.
#    Le job de build lançait `npm update` sur le backend juste avant de
#    construire l'image, sans jamais commiter le lockfile modifié : l'image
#    partait donc en production avec des dépendances qui n'étaient pas celles du
#    dépôt, et deux exécutions successives pouvaient produire des images
#    différentes à code identique. Les mises à jour passent désormais par
#    fix-cve.yml, qui les teste, les scanne ET les commite.
#
# 2. L'image scannée est exactement l'image poussée.
#    L'étape de push relançait un `docker build` distinct de celui qui avait
#    servi au scan Trivy. On builde une seule fois avec `load: true`, on scanne,
#    puis `docker tag` + `docker push` de ce binaire-là.
#
# 3. Le pin de digest est vérifié avant ET après le sed. Un sed qui ne matchait
#    rien laissait le job passer au vert sans rien déployer.
#
# 4. npm -> pnpm, Node 20/22 -> 26. La CI testait le frontend en Node 20 et le
#    backend en Node 22 pendant que l'image tournait en Node 22 : socles
#    hétérogènes. pnpm apporte `minimum-release-age=1440` (.npmrc), sans
#    équivalent chez npm.
#
# 5. `pnpm audit --prod` : l'audit ne bloque plus sur des paquets qui ne partent
#    jamais en production.
#
# 6. Le lint n'est plus en `continue-on-error`, et le typecheck est appelé — le
#    script existait dans package.json sans que rien ne l'exécute.

name: Build and push to GHCR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.73.0
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '26'

permissions:
  contents: read
  packages: write

# false et non true : ce job pousse des images sur GHCR puis commite le digest.
# Une annulation en plein milieu laisse une image publiée que values.yaml ne
# référence pas.
concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Frontend – install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend – audit (prod, high+)
        working-directory: Frontend
        run: pnpm audit --prod --audit-level high

      # Bloquant. Le `continue-on-error: true` qui traînait ici masquait toute
      # régression de lint.
      - name: Frontend – lint
        working-directory: Frontend
        run: pnpm lint

      # Le script existait dans package.json mais n'était jamais appelé.
      # Il cible tsconfig.app.json, plus strict que le tsconfig.json utilisé par
      # `pnpm build` — d'où des erreurs que le build ne remontait pas.
      - name: Frontend – typecheck
        working-directory: Frontend
        run: pnpm typecheck

      - name: Frontend – tests (if present)
        working-directory: Frontend
        run: pnpm run --if-present test

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Backend – install
        working-directory: Backend
        run: pnpm install --frozen-lockfile

      - name: Backend – audit (prod, high+)
        working-directory: Backend
        run: pnpm audit --prod --audit-level high

      - name: Backend – tests (if present)
        working-directory: Backend
        run: pnpm run --if-present test

  build-and-push:
    name: Build and push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Bump version (prod)
        id: tag
        run: |
          set -euo pipefail
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::version.txt invalide: $CONTENT (attendu X.Y.Z)"
            exit 1
          fi
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          TAG="v${NEW_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $CONTENT → $NEW_VERSION (tag: $TAG)"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Frontend ─────────────────────────────────────────────────────────────
      # Le Dockerfile frontend est un nginx qui copie dist/ : la compilation
      # doit donc avoir lieu ici.
      - name: Frontend – install & build (dist/ requis par Dockerfile)
        working-directory: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/edusport-connect-front
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build frontend (local)
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          load: true
          push: false
          tags: edusport-front:candidate
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan frontend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            edusport-front:candidate

      - name: Push frontend
        id: push-frontend
        env:
          META_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET=$(printf '%s\n' "$META_TAGS" | head -1)
          docker tag edusport-front:candidate "$TARGET"
          PUSH_OUT=$(docker push "$TARGET" | tee /dev/stderr)
          DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(printf '%s\n' "$PUSH_OUT" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1 || true)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Frontend publié : $TARGET (digest: ${DIGEST:-introuvable})"

      # ── Backend ──────────────────────────────────────────────────────────────
      # Pas de `npm update` ici : c'est fix-cve.yml qui met à jour les
      # dépendances, en les testant et en les commitant.
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/edusport-connect-back
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build backend (local)
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          load: true
          push: false
          tags: edusport-back:candidate
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan backend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            edusport-back:candidate

      - name: Push backend
        id: push-backend
        env:
          META_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET=$(printf '%s\n' "$META_TAGS" | head -1)
          docker tag edusport-back:candidate "$TARGET"
          PUSH_OUT=$(docker push "$TARGET" | tee /dev/stderr)
          DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(printf '%s\n' "$PUSH_OUT" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1 || true)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Backend publié : $TARGET (digest: ${DIGEST:-introuvable})"

      # ── Pin digest dans values.yaml → ArgoCD sync automatique ────────────────
      - name: Pin Helm values to image digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          DIGEST_FRONTEND: ${{ steps.push-frontend.outputs.digest }}
          DIGEST_BACKEND: ${{ steps.push-backend.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REG: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          VALUES_PATH="charts/edusport-connect/values.yaml"

          # Remplace la ligne `image:` d'un composant, en échouant bruyamment si
          # elle est introuvable ou si le remplacement n'a pas pris. Garde-fou
          # contre le déploiement fantôme : un sed muet passait au vert.
          update_image() {
            local key="$1" newref="$2"
            if ! grep -qE "^[[:space:]]+image:[[:space:]]*ghcr\.io/.*${key}[@:]" "$VALUES_PATH"; then
              echo "::error::Aucune ligne 'image:' pour ${key} dans ${VALUES_PATH}. Le pin de digest aurait échoué en silence."
              exit 1
            fi
            sed -i -E "s|^([[:space:]]+)image:[[:space:]]*ghcr\.io/.*${key}[@:].*|\1image: ${newref}|" "$VALUES_PATH"
            if ! grep -qF "image: ${newref}" "$VALUES_PATH"; then
              echo "::error::Le remplacement de ${key} n'a pas pris dans ${VALUES_PATH}."
              exit 1
            fi
            echo "  ${key} → ${newref}"
          }

          if [ -n "${DIGEST_FRONTEND:-}" ]; then
            FRONTEND_IMAGE="${REG}/${OWNER}/edusport-connect-front@${DIGEST_FRONTEND}"
          else
            FRONTEND_IMAGE="${REG}/${OWNER}/edusport-connect-front:${TAG}"
            echo "::warning::Digest frontend introuvable, pin sur le tag ${TAG} (déploiement OK mais non immuable)."
          fi
          if [ -n "${DIGEST_BACKEND:-}" ]; then
            BACKEND_IMAGE="${REG}/${OWNER}/edusport-connect-back@${DIGEST_BACKEND}"
          else
            BACKEND_IMAGE="${REG}/${OWNER}/edusport-connect-back:${TAG}"
            echo "::warning::Digest backend introuvable, pin sur le tag ${TAG} (déploiement OK mais non immuable)."
          fi

          # `edusport-connect-front` et `edusport-connect-back` sont des clés
          # distinctes : aucun risque qu'un remplacement écrase l'autre.
          update_image "edusport-connect-front" "$FRONTEND_IMAGE"
          update_image "edusport-connect-back"  "$BACKEND_IMAGE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "$VALUES_PATH"

          if git diff --staged --quiet; then
            echo "::warning::Rien à commiter alors que le pin a réussi — values.yaml pointait déjà sur ce digest."
          else
            git commit -m "chore(helm): pin images to digest ${TAG} [skip ci]"

            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed=true
                break
              fi
              echo "::warning::Push refusé (tentative ${attempt}/3), rebase sur origin/${BRANCH}…"
              git fetch origin "$BRANCH"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "::error::Conflit de rebase sur ${BRANCH}, intervention manuelle requise."
                exit 1
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Impossible de pousser le pin de digest après 3 tentatives."
              exit 1
            fi
          fi

          {
            echo "### Déploiement ${TAG}"
            echo "- Frontend : \`${FRONTEND_IMAGE}\`"
            echo "- Backend : \`${BACKEND_IMAGE}\`"
            echo ""
            echo "Images scannées par Trivy avant publication. ArgoCD synchronise le cluster dans les minutes qui suivent."
          } >> "$GITHUB_STEP_SUMMARY"
